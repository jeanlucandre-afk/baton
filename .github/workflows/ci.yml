name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Baton needs the macOS 26 SDK. If this image or Xcode isn't available yet, bump both here.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Core tests
        run: swift test
      # The app target needs Xcode 27: Xcode 26.6's compiler crashes on it (IRGen). Add the app build
      # back here once GitHub's macos-26 image ships Xcode 27:
      #   brew install xcodegen && cd App && xcodegen generate --quiet && xcodebuild -project Baton.xcodeproj \
      #     -scheme Baton -configuration Debug -derivedDataPath build CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="" -quiet build
