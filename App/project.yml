name: Baton
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  BatonCore:
    path: ..
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Baton:
    type: application
    platform: macOS
    sources: [Baton]
    dependencies:
      - package: BatonCore
      - package: KeyboardShortcuts
      - package: Defaults
      - package: Sparkle
    info:
      path: Baton/Info.plist
      properties:
        CFBundleDisplayName: Baton
        CFBundleShortVersionString: "0.2.2"
        CFBundleVersion: "4"
        LSUIElement: true
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        # Auto-updates (Sparkle): the feed on the download page, checked daily and installed on its own.
        # Releases are signed with the private half of this key, kept in the release Mac's login Keychain.
        SUFeedURL: https://jeanlucandre-afk.github.io/baton/appcast.xml
        SUPublicEDKey: rKMXmf64vh0n9Mns1JzJS4Fm8mRhxr5OFylps3W2GQY=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.baton.app
        PRODUCT_NAME: Baton
        # A real certificate keeps the app's identity stable across builds, so Accessibility stays granted.
        DEVELOPMENT_TEAM: UH8QWJNQQR
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
