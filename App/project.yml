name: Baton
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  BatonCore:
    path: ..
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.0
targets:
  Baton:
    type: application
    platform: macOS
    sources: [Baton]
    dependencies:
      - package: BatonCore
      - package: KeyboardShortcuts
      - package: Defaults
    info:
      path: Baton/Info.plist
      properties:
        CFBundleDisplayName: Baton
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.baton.app
        PRODUCT_NAME: Baton
        # A real certificate keeps the app's identity stable across builds, so Accessibility stays granted.
        DEVELOPMENT_TEAM: UH8QWJNQQR
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
